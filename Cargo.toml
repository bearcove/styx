[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["editors/zed-styx", "tools/styx-webmd"]

[workspace.package]
version = "5.0.0-rc.5"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/styx"
homepage = "https://github.com/bearcove/styx"

[workspace.dependencies]
ariadne = "0.6"
blake3 = { version = "1", default-features = false }
cbindgen = "0.28"
cc = "1.0.87"
dirs = "6"
eyre = "0.6"
facet = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-core = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-format = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-reflect = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
facet-testhelpers = { git = "https://github.com/facet-rs/facet", rev = "5705fa6c51289bea49f5729c52dc5e23cedce4f8" }
figue = { git = "https://github.com/bearcove/figue-next", rev = "361672c57316b2202ac0372f1c64988d8acfc6b6" }
futures = "0.3"
glob = "0.3"
goblin = "0.9"
hex = "0.4"
indexmap = { version = "2.12.1", default-features = false }
insta = "1.44"
lz4_flex = "0.11"
margin = { git = "https://github.com/bearcove/snark", rev = "2dcfc039aa43e14fa004238d00bd9eeb16bf859a" }
margin-term = { git = "https://github.com/bearcove/snark", rev = "2dcfc039aa43e14fa004238d00bd9eeb16bf859a" }
memmap2 = "0.9"
proc-macro2 = "1"
proptest = "1"
rowan = "0.16"
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde-wasm-bindgen = "0.6"
serde_json = { version = "1.0.145", features = ["alloc"] }
sha2 = "0.10"
similar = "2"
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread"] }
tower-lsp = "0.20"
tracing = { version = "0.1.43", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "std", "env-filter"] }
tree-sitter = { package = "arborium-tree-sitter", version = "2.18.0" }
unsynn = "0.3"
vox = { git = "https://github.com/bearcove/vox-next", rev = "e875e070d78690f45a06a13e8fc79cef84579ed4" }
vox-stream = { git = "https://github.com/bearcove/vox-next", rev = "e875e070d78690f45a06a13e8fc79cef84579ed4" }
wasm-bindgen = "0.2"
which = "7"

facet-styx = { path = "crates/facet-styx", version = "5.0.0-rc.5" }
serde_styx = { path = "crates/serde_styx", version = "5.0.0-rc.5" }
styx-cli = { path = "crates/styx-cli", version = "5.0.0-rc.5" }
styx-cst = { path = "crates/styx-cst", version = "5.0.0-rc.5" }
styx-embed = { path = "crates/styx-embed", version = "5.0.0-rc.5" }
styx-embed-macros = { path = "crates/styx-embed-macros", version = "5.0.0-rc.5" }
styx-format = { path = "crates/styx-format", version = "5.0.0-rc.5" }
styx-gen-go = { path = "crates/styx-gen-go", version = "5.0.0-rc.5" }
styx-lsp = { path = "crates/styx-lsp", version = "5.0.0-rc.5" }
styx-lsp-ext = { path = "crates/styx-lsp-ext", version = "5.0.0-rc.5" }
styx-lsp-test-schema = { path = "crates/styx-lsp-test-schema", version = "5.0.0-rc.5" }
styx-parse = { path = "crates/styx-parse", version = "5.0.0-rc.5" }
styx-testhelpers = { path = "crates/styx-testhelpers", version = "5.0.0-rc.5" }
styx-tokenizer = { path = "crates/styx-tokenizer", version = "5.0.0-rc.5" }
styx-tree = { path = "crates/styx-tree", version = "5.0.0-rc.5" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(facet_no_doc)", "cfg(kani)"] }

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release.package.styx-wasm]
opt-level = "s"
